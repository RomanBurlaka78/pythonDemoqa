name: Python Selenium Tests with Allure Report

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: 'Run Pytest + Generate Allure Report'
    runs-on: ubuntu-latest

    steps:
      # 1 Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      # 2 Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5.2.0
        with:
          python-version: '3.12'

      # 3  Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install allure-pytest

      # 4  Verify installed packages
      - name: Verify installed packages
        run: pip freeze

      # 5 Set up Chrome for Selenium
      - name: Set up Chrome and Chromedriver
        uses: browser-actions/setup-chrome@v1

      # 6 Run tests with Allure results
      - name: Run tests
        run: |
          pytest -s --alluredir=allure-results --disable-warnings -q
        env:
          PYTHONDONTWRITEBYTECODE: 1
          PYTHONUNBUFFERED: 1

      # 7 Generate Allure report
      - name: Generate Allure report
        run: |
          allure generate allure-results --clean -o allure-report

      # 8  Upload screenshots (optional)
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots

      # 9  Upload Allure report as artifact
      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report

      # 10 Get previous Allure history for gh-pages
      - name: Get Allure history
        uses: actions/checkout@v4
        if: always()
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      # 11 Build Allure report for Pages
      - name: Build Allure report for GitHub Pages
        if: always()
        uses: simple-elf/allure-report-action@master
        id: allure-report
        with:
          allure_results: allure-results
          gh_pages: gh-pages
          allure_report: allure-report
          allure_history: allure-history
          ref: gh-pages
          path: gh-pages
          keep_reports: 30

      # 12 Publish Allure report to GitHub Pages
      - name: Publish Allure report to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: allure-history

      # 13 Save logs if not-success
      - name: Save test logs
        if: failure()
        run: |
          pytest --log-cli-level=INFO --capture=tee-sys --disable-warnings > pytest.log || true
        shell: bash

        # 14 Loading logs as artifacts
      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4.4.3
        with:
          name: pytest-logs
          path: pytest.log